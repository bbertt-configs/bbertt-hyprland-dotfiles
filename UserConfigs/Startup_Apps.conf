# Commands and Apps to be executed at launch


# Mouseless (mouseless.click / net.sonuscape.mouseless) — keyboard-driven mouse control.
# Flatpak, so it has no systemd unit. Deliberately NOT named "mouseless.service":
# a user unit of that name would shadow jbensmann's /usr/lib/systemd/user/mouseless.service.
# Wait for jbensmann's virtual keyboard before starting Mouseless. Order is critical:
# whichever starts first grabs the physical keyboards exclusively (EVIOCGRAB). jbensmann
# must win, so Mouseless reads its post-remap output instead of competing for the raw device.
exec-once = sh -c 'for i in $(seq 1 30); do grep -q "mouseless keyboard" /proc/bus/input/devices && break; sleep 1; done; flatpak run net.sonuscape.mouseless'
